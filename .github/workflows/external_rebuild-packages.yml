name: Rebuild packages

on:
  repository_dispatch:
    types: [component-released]
    inputs:
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      build:
        required: false
        type: string
    secrets:
      PACKAGER_TOKEN:
        required: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show payload
        run: |
          echo "repo = ${{ github.event.client_payload.repo }}"
          echo "tag  = ${{ github.event.client_payload.tag }}"
          echo "sha  = ${{ github.event.client_payload.sha }}"

      - name: Validate payload
        run: |
          case "${{ github.event.client_payload.repo }}" in
            "Composable-Build/repo-bin1")
              echo "repo authorized"
              ;;
            *)
              echo "unauthorized repo"
              exit 1
              ;;
          esac
      - name: Rebuild packages
        run: python3 scripts/rebuild_packages.py --repo "${{ inputs.repo }}" --tag "${{ inputs.tag }}" --token "${{ secrets.PACKAGER_TOKEN }}"
        working-directory: repo-packager
