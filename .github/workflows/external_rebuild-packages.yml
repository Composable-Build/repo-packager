name: Rebuild packages

on:
  repository_dispatch:
    types: [component-released]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show payload
        run: |
          echo "repo = ${{ github.event.client_payload.repo }}"
          echo "tag  = ${{ github.event.client_payload.tag }}"
          echo "sha  = ${{ github.event.client_payload.sha }}"

      - name: Validate payload
        run: |
          case "${{ github.event.client_payload.repo }}" in
            "Composable-Build/repo-bin1")
              echo "repo authorized"
              ;;
            *)
              echo "unauthorized repo"
              exit 1
              ;;
          esac
      - name: Rebuild packages
        run: python3 scripts/rebuild_packages.py --repo "${{ github.event.client_payload.repo }}" --tag "${{ github.event.client_payload.tag }}"