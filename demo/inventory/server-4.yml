hostname: server-4
cpu: riscv
arch: riscv64
os: linux
libc: glibc
endian: little

devices:
  - name: binary_two
    type: binary
    repo: repo-bin2
    version: "^v1.1.0"
    extract: binary_two
    path: artifacts/repo-bin2/binary_two

  - name: peripheral-can-device
    type: firmware
    repo: repo-can-firmware
    version: "^v1.0.0"
    mcu: cortex-m4
    transport: can
    can_id: "0x126"